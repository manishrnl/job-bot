# Copy to config.yaml (setup.sh does it) and fill in.
# Keep this as a safe example file: no API key and no personal data.

ai:
  # auto = first one found of: claude, gemini, codex, ollama
  # Use "api" for a third-party OpenAI-compatible provider like aicredits.in
  backend: api
  api_key: ""              # e.g. your token from https://aicredits.in/dashboard
  api_base: "https://api.aicredits.in/v1"  # OpenAI-compatible base URL
  api_model: "gemini-2.5-flash-lite" # cheapest Gemini family model where available
  claude_model: sonnet      # resume writing ("opus" = best but slower)
  claude_fast_model: haiku  # form answers, keyword lists
  ollama_model: llama3.1
  timeout: 300

# LinkedIn's PDF export often lacks phone etc. Anything set here overrides the profile.
contact:
  name: ""
  email: ""
  phone: ""
  location: ""              # e.g. "Bengaluru, India"
  links: []                 # e.g. ["linkedin.com/in/you", "github.com/you"]

resume:
  target_role: "Backend Engineer"  # default role for `jobbot build`
  accent_color: "#1F4E79"   # headings colour; keep it dark for print/ATS
  pages: auto               # auto | 1 | 2
  min_score: 85             # tailor loop tries to reach this ATS score
  refine_passes: 1          # extra rewrite passes when below min_score (each ~30-60s)

search:
  keywords:
    - "TCS Java Developer"
    - "Infosys Java Developer"
    - "Capgemini Java Developer"
    - "Cognizant Java Developer"
    - "Wipro Java Developer"
    - "LTIMindtree Java Developer"
    - "HCLTech Java Developer"
    - "Java Backend Developer"
    - "Java Developer"
    - "Backend Engineer"
    - "Spring Boot Developer"
    - "Java API Developer"
    - "Microservices Developer"
    - "Java Full Stack Developer"
    - "Java Software Engineer"
  location: "India"
  remote_only: false
  posted_within: 7d
  request_timeout_seconds: 15 # per LinkedIn public-search request
  request_retries: 3          # transient timeouts/network errors before skipping the request
  experience_levels:
    - 1
    - 2
  exclude_companies: []
  exclude_title_words:
    - principal
    - staff
    - director
    - architect
    - senior
    - lead
    - manager
    - vp

apply:
  max_per_run: 5
  parallel_resumes: 2
  min_skill_overlap: 2
  min_fit: 35
  min_match_score: 45
  delay_seconds:
    - 25
    - 55
  follow_companies: false
  headless: false

# Answers for application-form questions, matched by words in the question.
answers:
  - match:
      - total experience
      - years of experience
      - years of work experience
    answer: "0"
  - match:
      - notice period
    answer: "30"
  - match:
      - current ctc
      - current salary
      - current compensation
    answer: "0"
  - match:
      - expected ctc
      - expected salary
      - expected compensation
      - salary expectation
    answer: "300000"
  - match:
      - authorized to work
      - authorised to work
      - legally
      - work authorization
    answer: "Yes"
  - match:
      - sponsorship
      - visa
    answer: "No"
  - match:
      - relocate
      - relocation
    answer: "Yes"
  - match:
      - commute
      - onsite
      - on-site
      - hybrid
      - work from office
    answer: "Yes"
  - match:
      - immediate joiner
      - join immediately
    answer: "No"
